    statement: >-
      Run yolo governors for two engagements of one workspace one after the other, not concurrently: the workspace
      runner takes one job at a time, the governor holding it queues its next job at once, and a waiting governor only
      retries every 30 s, so the waiting run starves until the other run ends.
    rationale: >-
      runUntilDone in src/yolo/governor.ts sleeps PROPOSED_RUNNER_BUSY_WAIT_MS (30 s) on 'one job at a time' while
      start_attempt refuses any second running attempt in the workspace; observed twice on 2026-10-14 (core waited 18
      minutes without a job).
    source: src/yolo/governor.ts; src/runner/jobs.ts start_attempt; yolo-0001/yolo-0002 runs 2026-10-14

    updated_at: "2026-10-12T16:35:48.955Z"
    statement: >-
      In the harness, engagement.active_snapshot names the snapshot by identity only: the build hook revises the
      target_snapshot record (inventory, layouts), so the stored ref's revision lags. Resolve the head (activeSnapshotOf
      in src/snapshot/common.ts, activeSnapshot in src/decision/common.ts) before binding an exact ref into a record or
      approval.
    rationale: >-
      A record that pins the stale revision in depends_on makes every later decision on it fail with stale_dependency,
      as approve_export did in the milestone test until report/context code resolved heads.
    source: >-
      test/e2e-milestone.test.ts failure on 2026-10-12; fix in src/report/export.ts, src/report/render.ts,
      src/context/builder.ts, src/decision/common.ts
    derivation_count: 1
    pack: null
    abstract: null
    derived_from: null

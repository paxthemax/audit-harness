      for investigations (job link appended, work moved to running) and for scenario variants (job link appended by
      request_job, e.g. an experiment the investigator requested earlier in the same round); any other intervening
      change, such as a recorded outcome, stays a retained revision_conflict (onlyDispatchSince in
      src/decision/proposals.ts).
    rationale: >-

    updated_at: "2026-10-14T11:45:55.362Z"
    statement: >-
      A git-ignored directory that contains an `upstream` dependency root (e.g. node_modules/@celo/contracts) is dropped
      whole by freezeSource's filter, so the dependency never enters the snapshot and is reported as MODIFIED against
      its pristine copy.
    rationale: >-
      In src/snapshot/source.ts the filter is applied to directories as well as files; the ancestor `node_modules` is
      ignored and is not itself under a dep root, so it is excluded before its children are visited.
    source: >-
      src/snapshot/source.ts filter (lines ~317-330); observed 2026-10-14 registering sources/mento-core as
      mento-v3-core snap-0001

      link, and start_attempt may move work to running), so any agent proposal that names the investigation's revision
      from its context is one revision stale; submit_proposal rebases only over such dispatch-only revisions
      (onlyDispatchSince in src/decision/proposals.ts) and any other intervening change stays a retained
      revision_conflict.

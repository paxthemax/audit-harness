    updated_at: "2026-10-12T16:35:49.059Z"
    statement: >-
      When recovering a Git-backed record store after a crash, run `git reset` before quarantining uncommitted files and
      restore from HEAD: files staged by a crash between `git add` and `git commit` are still in the index, and `git
      checkout -- .` restores them, resurrecting unacknowledged records.
    rationale: >-
      Only HEAD is acknowledged state; the index can hold a half-finished transaction, so restoring from it turns an
      unacknowledged write into a committed one on the next commit.
    source: >-
      adversarial review finding C2 (2026-10-12); fix in src/store/recordStore.ts recoverUncommitted; test 'C2: files
      staged but never committed are not resurrected by recovery' in test/review-regressions.test.ts

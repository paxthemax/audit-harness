    version: 2
    status: active
    consolidated: false
    type: architectural
    scope: project:framework
    visibility: private
    created_at: "2026-10-13T04:58:30.119Z"
    updated_at: "2026-10-13T04:58:30.119Z"
    statement: >-
      A Claude Pro/Max subscription cannot back harness worker agents: the provider broker must not hold or inject
      Claude.ai OAuth tokens (Anthropic forbids third parties to collect, store or intermediate them), and third-party
      harnesses such as pi/omp that use a Claude subscription bill it as per-token extra usage. Brokered agent rounds
      need an API key; the subscription fits only the auditor's own use of the unmodified claude binary.
    rationale: >-
      Anthropic's Claude Code legal-and-compliance page restricts OAuth to ordinary use of native Anthropic apps and
      requires API keys for products and the Agent SDK; pi 1.2.0 shows a warning that third-party harness use of a
      Claude subscription draws from extra usage. This changes if Anthropic changes those terms.
    source: >-
      https://code.claude.com/docs/en/legal-and-compliance (fetched 2026-10-13); pi-coding-agent 1.2.0
      dist/modes/interactive/interactive-mode.js ANTHROPIC_SUBSCRIPTION_AUTH_WARNING
    derivation_count: 1

    statement: >-
      Submit bulk harness proposals with a per-record idempotency ledger and a long command timeout. An interrupted CLI
      call can commit to the append-only store before the ledger is written, so reconcile the ledger against the store's
      record files before resuming, or a rerun creates duplicate records.

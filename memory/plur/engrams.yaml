      stdio`, pinned version, dedicated OMP_PROFILE=harness). It serves the Claude Team seat as provider omp-anthropic
      and the ChatGPT plan as omp-openai-codex, with no API keys and no fallback this round. The operator accepted the
      Anthropic-terms risk. The harness never reads the logins, and agents reach models only through the broker socket.
    rationale: >-
      The operator chose it after omp's gateway answered Claude and GPT tool-use requests in Anthropic Messages format;
      the broker keeps every check (grant, data class, reservation), so the design's broker rule holds unchanged.

    statement: >-
      Open harness defect: a review packet's replay_receipt is the latest clean replay of the whole investigation
      (latestEvidence(store, inv, 'replay') in src/decision/packets.ts), not the replay of the variant the claim rests
      on; with two main-claim variants the packet can cite the other variant's replay, and replay status would be wrong
      if only one variant replays. Fixing it changes which receipt executable_replay accepts, so it needs the operator.
    rationale: >-
      latestEvidence filters by purpose and linked-claim scope only; variants of the main claim share scope
      linkedClaimId null.
